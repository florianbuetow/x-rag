# Production evaluation configuration
# Uses LM Studio local embeddings (same embedding provider as production)

name: production-v1

# Evaluation dataset
dataset_path: data/eval/@JasonLiu/video-transcripts/medium-en/qwen2.5-7b-instruct-mlx/dataset.json

# Embedding configuration (uses production EmbeddingConfig.for_local())
embedding:
  provider: local
  model: text-embedding-bge-large-en-v1.5
  base_url: http://localhost:1234/v1
  batch_size: 50

# Chunking configuration (uses same parameters as IndexerConfig)
chunking:
  chunk_size: 500
  chunk_overlap: 50

# Search configuration (uses same parameters as SearchServiceConfig)
search:
  mode: hybrid
  top_k: 10
  alpha: 0.5

# Index configuration
index:
  documents_path: data/raw/@JasonLiu/video-transcripts/medium-en
  collection: DocumentChunk

# Output
output_dir: evals/reports
include_per_sample: false
