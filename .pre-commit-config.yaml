# Pre-commit hooks configuration
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
# Skip temporarily: SKIP=run-make-ci-quiet git commit -m "..." or git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: gitignore-enforcer
        name: Block .gitignore violations in staged files
        entry: ./scripts/check-gitignore-violations.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: run-make-ci-quiet
        name: Run make ci-quiet
        entry: make ci-quiet
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
