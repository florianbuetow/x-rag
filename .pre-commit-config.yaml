# Pre-commit hooks configuration
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
# Skip temporarily: SKIP=run-make-ci git commit -m "..." or git commit --no-verify

repos:
  - repo: local
    hooks:
      - id: run-make-ci
        name: Run make ci
        entry: make ci
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
