apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: rag-system
  labels:
    app: ingestion-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 30082
    - name: metrics
      port: 8080
      targetPort: 8080
  selector:
    app: ingestion-api
