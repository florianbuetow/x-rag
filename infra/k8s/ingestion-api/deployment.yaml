apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: rag-system
  labels:
    app: ingestion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingestion-api
          image: localhost:5000/ingestion-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8082
            - name: metrics
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ingestion-api-config
            - secretRef:
                name: ingestion-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
