apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: rag-system
  labels:
    app: embedding-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: embedding-service
