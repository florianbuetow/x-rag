apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-service-config
  namespace: rag-system
  labels:
    app: embedding-service
data:
  SERVICE_NAME: "embedding-service"
  LOG_LEVEL: "INFO"
  PORT: "50051"
  # Generator type: "hash_based" or "openai"
  EMBEDDING_GENERATOR: "openai"
  DEFAULT_MODEL: "text-embedding-bge-large-en-v1.5"
  MAX_BATCH_SIZE: "100"
  ENABLE_REFLECTION: "true"
  MAX_WORKERS: "10"

  # Hash-based settings (for testing)
  HASH_BASED_DIMENSION: "1024"

  # OpenAI settings (or OpenAI-compatible API like LM Studio)
  OPENAI_API_BASE: "http://host.docker.internal:1234/v1"
  OPENAI_EMBEDDING_MODEL: "text-embedding-bge-large-en-v1.5"
  OPENAI_MAX_RETRIES: "3"
  OPENAI_TIMEOUT: "30"

  # Distributed tracing (OpenTelemetry)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://xrag-tempo:4317"
  ENVIRONMENT: "development"
