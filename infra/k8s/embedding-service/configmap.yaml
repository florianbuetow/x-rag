apiVersion: v1
kind: ConfigMap
metadata:
  name: embedding-service-config
  namespace: rag-system
  labels:
    app: embedding-service
data:
  SERVICE_NAME: "embedding-service"
  LOG_LEVEL: "INFO"
  PORT: "50051"
  EMBEDDING_GENERATOR: "hash_based"
  DEFAULT_MODEL: "hash-small"
  MAX_BATCH_SIZE: "100"
  ENABLE_REFLECTION: "true"
  MAX_WORKERS: "10"
  HASH_BASED_DIMENSION: "1536"
