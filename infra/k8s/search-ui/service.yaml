apiVersion: v1
kind: Service
metadata:
  name: search-ui
  namespace: rag-system
  labels:
    app: search-ui
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: metrics
      port: 9091
      targetPort: 9091
  selector:
    app: search-ui
