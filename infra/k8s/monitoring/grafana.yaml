apiVersion: v1
kind: Service
metadata:
  name: xrag-grafana
  namespace: rag-system
spec:
  type: NodePort
  ports:
    - port: 3000
      nodePort: 30030
  selector:
    app: xrag-grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrag-grafana
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrag-grafana
  template:
    metadata:
      labels:
        app: xrag-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
