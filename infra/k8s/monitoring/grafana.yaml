apiVersion: v1
kind: Service
metadata:
  name: xrag-grafana
  namespace: rag-system
spec:
  type: NodePort
  ports:
    - port: 3000
      nodePort: 30030
  selector:
    app: xrag-grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrag-grafana
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrag-grafana
  template:
    metadata:
      labels:
        app: xrag-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
