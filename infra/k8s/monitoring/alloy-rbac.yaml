# RBAC for Grafana Alloy to scrape kubelet metrics
# Required for discovery.kubernetes and kubelet /metrics/resource endpoint
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: rag-system
  labels:
    app: xrag-alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app: xrag-alloy
rules:
  # Required for discovery.kubernetes to discover nodes
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
    verbs: ["get", "list", "watch"]
  # Required for discovery.kubernetes to discover pods/services/endpoints
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  # Required for kubelet metrics access
  - nonResourceURLs:
      - /metrics
      - /metrics/resource
      - /metrics/cadvisor
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app: xrag-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: rag-system
