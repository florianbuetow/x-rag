apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'search-ui'
        static_configs:
          - targets: ['search-ui:9091']
      - job_name: 'search-service'
        static_configs:
          - targets: ['search-service:8080']
      - job_name: 'ingestion-api'
        static_configs:
          - targets: ['ingestion-api:8080']
      - job_name: 'embedding-service'
        static_configs:
          - targets: ['embedding-service:8080']
      - job_name: 'indexer'
        static_configs:
          - targets: ['indexer:8081']
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: v1
kind: Service
metadata:
  name: xrag-prometheus
  namespace: rag-system
spec:
  type: NodePort
  ports:
    - port: 9090
      nodePort: 30090
  selector:
    app: xrag-prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrag-prometheus
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrag-prometheus
  template:
    metadata:
      labels:
        app: xrag-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
