apiVersion: v1
kind: Service
metadata:
  name: xrag-alloy
  namespace: rag-system
  labels:
    app: xrag-alloy
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 12345
      targetPort: 12345
  selector:
    app: xrag-alloy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrag-alloy
  namespace: rag-system
  labels:
    app: xrag-alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xrag-alloy
  template:
    metadata:
      labels:
        app: xrag-alloy
    spec:
      containers:
        - name: alloy
          image: grafana/alloy:v1.4.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 12345
              name: ui
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
