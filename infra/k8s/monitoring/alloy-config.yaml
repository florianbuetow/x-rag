apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // =============================================================================
    // Grafana Alloy Configuration for X-RAG
    // =============================================================================
    // Receives OTLP metrics and traces from services
    // - Metrics -> Prometheus (via remote_write)
    // - Traces -> Tempo (via OTLP)
    
    // -----------------------------------------------------------------------------
    // OTLP Receiver - receives metrics and traces from services
    // -----------------------------------------------------------------------------
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.batch.metrics.input]
        traces  = [otelcol.processor.batch.traces.input]
      }
    }
    
    // -----------------------------------------------------------------------------
    // Batch Processor for Metrics
    // -----------------------------------------------------------------------------
    otelcol.processor.batch "metrics" {
      timeout = "5s"
      send_batch_size = 1000
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
      }
    }
    
    // -----------------------------------------------------------------------------
    // Batch Processor for Traces
    // -----------------------------------------------------------------------------
    otelcol.processor.batch "traces" {
      timeout = "5s"
      send_batch_size = 500
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }
    
    // -----------------------------------------------------------------------------
    // Prometheus Exporter - converts OTLP to Prometheus format
    // -----------------------------------------------------------------------------
    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // -----------------------------------------------------------------------------
    // Remote Write - sends metrics to Prometheus
    // -----------------------------------------------------------------------------
    prometheus.remote_write "prom" {
      endpoint {
        url = "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }
    
    // -----------------------------------------------------------------------------
    // OTLP Exporter - sends traces to Tempo
    // -----------------------------------------------------------------------------
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.monitoring.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }
    
    // -----------------------------------------------------------------------------
    // Logging - for debugging
    // -----------------------------------------------------------------------------
    logging {
      level = "info"
      format = "logfmt"
    }
    
    // =============================================================================
    // KUBERNETES POD SYSTEM METRICS
    // =============================================================================
    //
    // We collect pod metrics from THREE different sources because each provides
    // unique data that the others don't:
    //
    // 1. KUBELET /metrics/resource (lightweight, real-time)
    //    - Basic CPU and memory usage per container
    //    - Minimal overhead, fast scraping (30s interval)
    //    - Metrics: container_cpu_usage_seconds_total, container_memory_working_set_bytes
    //
    // 2. KUBELET /metrics/cadvisor (comprehensive runtime metrics)
    //    - Network I/O (bytes, packets, errors per interface)
    //    - Disk/Filesystem I/O (reads, writes, usage)
    //    - Detailed memory breakdown (cache, RSS, swap)
    //    - CPU throttling metrics
    //    - Resource limits from container spec
    //    - Higher overhead, slower scraping (60s interval)
    //
    // 3. KUBE-STATE-METRICS (Kubernetes API object state)
    //    - Resource requests and limits (what was REQUESTED vs cAdvisor's actual LIMIT)
    //    - Pod status, phase, conditions
    //    - Container restart counts
    //    - Deployment replica counts
    //    - NOT runtime metrics - reflects K8s API state
    //
    // Together these enable queries like:
    //   - "Pods using more memory than requested" (kube-state + cadvisor)
    //   - "Containers being CPU throttled" (cadvisor)
    //   - "Network throughput per pod" (cadvisor)
    //   - "Pods in CrashLoopBackOff" (kube-state-metrics)
    //
    // =============================================================================
    
    // =============================================================================
    // Source 1: Kubelet /metrics/resource (Basic CPU/Memory)
    // =============================================================================
    
    // -----------------------------------------------------------------------------
    // Kubernetes Node Discovery
    // -----------------------------------------------------------------------------
    discovery.kubernetes "nodes" {
      role = "node"
    }
    
    // -----------------------------------------------------------------------------
    // Relabel node targets to kubelet /metrics/resource endpoint
    // -----------------------------------------------------------------------------
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      
      rule {
        source_labels = ["__address__"]
        regex         = "(.+):(.+)"
        target_label  = "__address__"
        replacement   = "$1:10250"
      }
      
      rule {
        target_label = "__scheme__"
        replacement  = "https"
      }
      
      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics/resource"
      }
      
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }
    
    // -----------------------------------------------------------------------------
    // Scrape kubelet /metrics/resource endpoint
    // -----------------------------------------------------------------------------
    prometheus.scrape "kubelet_resource" {
      targets         = discovery.relabel.kubelet.output
      job_name        = "kubelet-resource"
      scheme          = "https"
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      
      tls_config {
        insecure_skip_verify = true
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // =============================================================================
    // Source 2: Kubelet /metrics/cadvisor (Network, Disk, Detailed Memory)
    // =============================================================================
    
    // -----------------------------------------------------------------------------
    // Relabel node targets to kubelet /metrics/cadvisor endpoint
    // -----------------------------------------------------------------------------
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      
      rule {
        source_labels = ["__address__"]
        regex         = "(.+):(.+)"
        target_label  = "__address__"
        replacement   = "$1:10250"
      }
      
      rule {
        target_label = "__scheme__"
        replacement  = "https"
      }
      
      rule {
        target_label = "__metrics_path__"
        replacement  = "/metrics/cadvisor"
      }
      
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    }
    
    // -----------------------------------------------------------------------------
    // Scrape kubelet /metrics/cadvisor endpoint
    // -----------------------------------------------------------------------------
    prometheus.scrape "cadvisor" {
      targets         = discovery.relabel.cadvisor.output
      job_name        = "cadvisor"
      scheme          = "https"
      scrape_interval = "60s"
      scrape_timeout  = "15s"
      
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      
      tls_config {
        insecure_skip_verify = true
      }
      
      forward_to = [prometheus.relabel.cadvisor_filter.receiver]
    }
    
    // -----------------------------------------------------------------------------
    // Filter cAdvisor metrics to reduce cardinality
    // Keep only essential metrics for pod monitoring
    // -----------------------------------------------------------------------------
    prometheus.relabel "cadvisor_filter" {
      rule {
        source_labels = ["__name__"]
        regex         = "container_(cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|memory_usage_bytes|memory_cache|memory_rss|network_receive_bytes_total|network_transmit_bytes_total|network_receive_packets_total|network_transmit_packets_total|network_receive_errors_total|network_transmit_errors_total|fs_usage_bytes|fs_limit_bytes|fs_reads_bytes_total|fs_writes_bytes_total|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period)"
        action        = "keep"
      }
      
      // Drop metrics for pause containers (infrastructure containers)
      // But keep network metrics which have empty container label
      rule {
        source_labels = ["container"]
        regex         = "POD"
        action        = "drop"
      }
      
      // Drop empty container labels EXCEPT for network metrics
      // (network metrics are reported at pod level with container="")
      rule {
        source_labels = ["__name__", "container"]
        regex         = "container_(cpu|memory|fs|spec).*;^$"
        action        = "drop"
      }
      
      // Drop node-level aggregates (id="/")
      rule {
        source_labels = ["id"]
        regex         = "/"
        action        = "drop"
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // =============================================================================
    // Source 3: kube-state-metrics (K8s API Object State)
    // =============================================================================
    
    // -----------------------------------------------------------------------------
    // Scrape kube-state-metrics service
    // -----------------------------------------------------------------------------
    prometheus.scrape "kube_state_metrics" {
      targets = [
        {"__address__" = "kube-state-metrics.monitoring.svc.cluster.local:8080"},
      ]
      job_name        = "kube-state-metrics"
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      
      forward_to = [prometheus.relabel.kube_state_filter.receiver]
    }
    
    // -----------------------------------------------------------------------------
    // Filter kube-state-metrics to essential pod/deployment metrics
    // -----------------------------------------------------------------------------
    prometheus.relabel "kube_state_filter" {
      // Keep pod, container, deployment, node, and resource metrics
      rule {
        source_labels = ["__name__"]
        regex         = "kube_(pod_status_phase|pod_status_ready|pod_status_scheduled|pod_container_status_restarts_total|pod_container_status_running|pod_container_status_waiting|pod_container_status_terminated|pod_container_resource_requests|pod_container_resource_limits|pod_info|pod_created|pod_start_time|deployment_status_replicas|deployment_status_replicas_available|deployment_status_replicas_unavailable|deployment_spec_replicas|statefulset_status_replicas|statefulset_status_replicas_ready|node_status_condition|node_status_allocatable|node_info|namespace_status_phase)"
        action        = "keep"
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // =============================================================================
    // INFRASTRUCTURE SERVICE METRICS
    // =============================================================================
    //
    // Scrape metrics from infrastructure services: Redis, Kafka, MinIO
    // These provide internal service health and performance data beyond what
    // cAdvisor/kube-state-metrics provide.
    //
    // =============================================================================
    
    // -----------------------------------------------------------------------------
    // Redis Exporter (sidecar in redis pod)
    // Metrics: commands, memory, connections, keyspace, persistence
    // -----------------------------------------------------------------------------
    prometheus.scrape "redis_exporter" {
      targets = [
        {"__address__" = "xrag-redis.rag-system.svc.cluster.local:9121"},
      ]
      job_name        = "redis"
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      
      forward_to = [prometheus.relabel.redis_filter.receiver]
    }
    
    prometheus.relabel "redis_filter" {
      // Keep essential Redis metrics, drop verbose/rarely-used ones
      rule {
        source_labels = ["__name__"]
        regex         = "redis_(up|uptime_in_seconds|connected_clients|blocked_clients|commands_total|commands_duration_seconds_total|memory_used_bytes|memory_max_bytes|memory_used_rss_bytes|mem_fragmentation_ratio|db_keys|db_keys_expiring|expired_keys_total|evicted_keys_total|keyspace_hits_total|keyspace_misses_total|connected_slaves|instantaneous_ops_per_sec|instantaneous_input_kbps|instantaneous_output_kbps|rejected_connections_total|rdb_last_save_timestamp_seconds|rdb_changes_since_last_save|aof_rewrite_in_progress|slowlog_length|net_input_bytes_total|net_output_bytes_total|loading_dump_file)"
        action        = "keep"
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // -----------------------------------------------------------------------------
    // Kafka Exporter (separate deployment)
    // Metrics: consumer lag, topic partitions, broker info, offsets
    // -----------------------------------------------------------------------------
    prometheus.scrape "kafka_exporter" {
      targets = [
        {"__address__" = "kafka-exporter.rag-system.svc.cluster.local:9308"},
      ]
      job_name        = "kafka"
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      
      forward_to = [prometheus.relabel.kafka_filter.receiver]
    }
    
    prometheus.relabel "kafka_filter" {
      // Keep essential Kafka metrics
      rule {
        source_labels = ["__name__"]
        regex         = "kafka_(brokers|broker_info|topic_partitions|topic_partition_current_offset|topic_partition_oldest_offset|topic_partition_leader|topic_partition_replicas|topic_partition_in_sync_replica|topic_partition_under_replicated_partition|consumergroup_current_offset|consumergroup_lag|consumergroup_members|exporter_build_info)"
        action        = "keep"
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
    
    // -----------------------------------------------------------------------------
    // MinIO Native Metrics Endpoint
    // Metrics: S3 requests, traffic, bucket usage, operations
    // -----------------------------------------------------------------------------
    prometheus.scrape "minio" {
      targets = [
        {"__address__" = "xrag-minio.rag-system.svc.cluster.local:9000"},
      ]
      job_name        = "minio"
      metrics_path    = "/minio/v2/metrics/cluster"
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      
      forward_to = [prometheus.relabel.minio_filter.receiver]
    }
    
    prometheus.relabel "minio_filter" {
      // Keep essential MinIO metrics
      rule {
        source_labels = ["__name__"]
        regex         = "minio_(s3_requests_total|s3_requests_errors_total|s3_requests_waiting_total|s3_requests_incoming_total|s3_requests_rejected_auth_total|s3_requests_rejected_header_total|s3_requests_rejected_invalid_total|s3_requests_4xx_errors_total|s3_requests_5xx_errors_total|s3_traffic_received_bytes|s3_traffic_sent_bytes|s3_requests_ttfb_seconds_distribution|bucket_usage_object_total|bucket_usage_total_bytes|node_drive_total_bytes|node_drive_used_bytes|node_drive_free_bytes|cluster_capacity_usable_total_bytes|cluster_capacity_usable_free_bytes|cluster_health_status|node_process_uptime_seconds|inter_node_traffic_received_bytes|inter_node_traffic_sent_bytes|software_version_info)"
        action        = "keep"
      }
      
      forward_to = [prometheus.remote_write.prom.receiver]
    }
