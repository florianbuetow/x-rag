apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: rag-system
  labels:
    app: search-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: search-service
