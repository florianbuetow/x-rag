apiVersion: v1
kind: Service
metadata:
  name: indexer
  namespace: rag-system
  labels:
    app: indexer
spec:
  type: ClusterIP
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
  selector:
    app: indexer
