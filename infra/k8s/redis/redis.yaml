apiVersion: v1
kind: Service
metadata:
  name: xrag-redis
  namespace: rag-system
spec:
  type: NodePort
  ports:
    - port: 6379
      nodePort: 30079
  selector:
    app: xrag-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xrag-redis
  namespace: rag-system
spec:
  serviceName: xrag-redis
  replicas: 1
  selector:
    matchLabels:
      app: xrag-redis
  template:
    metadata:
      labels:
        app: xrag-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
