service:
  name: embedding-service
  port: 50051
  log_level: INFO

grpc:
  enable_reflection: true
  max_workers: 10
  timeout: 30

embedding:
  generator: openai
  default_model: text-embedding-bge-large-en-v1.5
  max_batch_size: 100
  hash_based_dimension: 1024

openai:
  api_base: http://host.docker.internal:1234/v1
  model: text-embedding-bge-large-en-v1.5
  max_retries: 3
  timeout: 30

tracing:
  otlp_endpoint: http://tempo.monitoring.svc.cluster.local:4317
  environment: development
