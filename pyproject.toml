[project]
name = "x-rag"
version = "0.1.0"
description = "X-RAG: Distributed Search & Indexing for Retrieval-Augmented Generation"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Haystack for RAG
    "haystack-ai>=2.0.0",
    "weaviate-haystack>=2.0.0",
    
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    
    # HTTP client
    "httpx>=0.25.0",
    
    # Databases/Caching
    "redis[hiredis]>=5.0.0",
    "weaviate-client>=4.0.0",
    
    # LLM/Embeddings
    "openai>=1.3.0",
    
    # Messaging
    "aiokafka>=0.9.0",
    
    # Object storage
    "boto3>=1.29.0",
    "minio>=7.2.0",
    
    # Observability
    "prometheus-client>=0.19.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-grpc>=0.8.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "mypy-protobuf>=3.5.0",
    # Type stubs
    "types-protobuf>=5.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Core errors & warnings, Google-style docs, types, bugbear, quotes, imports, naming
select = ["E", "F", "D", "ANN", "B", "Q", "I", "N"]
ignore = [
  "D107",    # don't require __init__ docstring (class docstring is fine)
  "N802",    # allow non-lowercase function names (needed for gRPC method names)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]  # optional, if you find tests too noisy

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

# Exclude generated and third-party code
exclude = [
    "src/proto_gen/",
    ".venv/",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/proto_gen/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"
