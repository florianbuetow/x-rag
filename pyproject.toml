[project]
name = "x-rag"
version = "0.1.0"
description = "X-RAG: Distributed Search & Indexing for Retrieval-Augmented Generation"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Haystack for RAG
    "haystack-ai>=2.0.0",
    "weaviate-haystack>=2.0.0",
    
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    
    # HTTP client
    "httpx>=0.25.0",
    
    # Databases/Caching
    "redis[hiredis]>=5.0.0",
    "weaviate-client>=4.0.0",
    
    # LLM/Embeddings
    "openai>=1.3.0",
    
    # Messaging
    "aiokafka>=0.9.0",
    
    # Object storage
    "boto3>=1.29.0",
    "minio>=7.2.0",
    
    # Observability
    "prometheus-client>=0.19.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-grpc>=0.8.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "mypy-protobuf>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
