[project]
name = "x-rag"
version = "0.1.0"
description = "X-RAG: Distributed Search & Indexing for Retrieval-Augmented Generation"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Haystack for RAG
    "haystack-ai>=2.0.0",
    "weaviate-haystack>=2.0.0",
    
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-reflection>=1.60.0",
    
    # HTTP client
    "httpx>=0.25.0",
    
    # Databases/Caching
    "redis[hiredis]>=5.0.0",
    "weaviate-client>=4.0.0",
    
    # LLM/Embeddings
    "openai>=1.3.0",
    
    # Messaging
    "aiokafka>=0.9.0",
    
    # Object storage
    "minio>=7.2.0",
    
    # Observability
    "prometheus-client>=0.19.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-grpc>=0.8.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "mypy-protobuf>=3.5.0",
    "bandit[toml]>=1.7.8",
    "deptry>=0.20.0",
    "pygount>=1.6.4",
    "codespell>=2.3.0",
    "pip-audit>=2.7.0",
    # Type stubs
    "types-protobuf>=5.27.0",
    "types-grpcio",
    "types-grpcio-reflection",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py311"
# Exclude generated gRPC/protobuf code from all linting
exclude = ["src/proto_gen/*"]

[tool.ruff.lint]
# Core errors & warnings, Google-style docs, types, bugbear, quotes, imports, naming
# Plus: complexity, modern syntax, performance, simplifications, tidy imports
select = [
  "E", "F",   # pycodestyle errors, pyflakes
  "D",        # pydocstyle (Google-style)
  "ANN",      # flake8-annotations
  "B",        # flake8-bugbear
  "Q",        # flake8-quotes
  "I",        # isort
  "N",        # pep8-naming
  "C90",      # mccabe complexity
  "UP",       # pyupgrade (modern Python 3.11+ syntax)
  "PERF",     # perflint (performance anti-patterns)
  "SIM",      # flake8-simplify
  "TID",      # flake8-tidy-imports
]
ignore = [
  "D107",    # don't require __init__ docstring (class docstring is fine)
  "N802",    # allow non-lowercase function names (needed for gRPC method names)
]

[tool.ruff.lint.mccabe]
# Flag functions with complexity > 10 (default is 10, explicit for clarity)
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports for cleaner, more explicit code
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]  # optional, if you find tests too noisy

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-timeout: prevent tests from hanging indefinitely (especially async/gRPC)
timeout = 30
timeout_method = "thread"
# pytest-randomly: randomize test order to catch hidden dependencies
# Seed is logged; use --randomly-seed=<value> to reproduce

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

# Limit what mypy considers part of the project
files = ["src", "tests"]

# CI ergonomics
show_error_codes = true
pretty = true

# Exclude virtual environment (files already excludes it, but belt-and-suspenders)
exclude = [".venv/"]

# Generated protobuf / gRPC code – ignore errors completely
[[tool.mypy.overrides]]
module = ["src.proto_gen.*"]
ignore_errors = true

# Tests – still type checked, but not fully strict
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/proto_gen/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.bandit]
targets = ["src"]
exclude = [
    "tests",
    "*/proto_gen/*",
    ".venv",
    "venv",
]

# Reasonable default for CI:
severity = "MEDIUM"
confidence = "MEDIUM"

[tool.deptry]
# Source scanning - only check src/ directory
# Default excludes: .venv, .direnv, .git, tests, setup.py
extend_exclude = [
    "build",
    "dist",
    "docs",
    "scripts",
    "infra",
    "proto",
    "data",
    "reports",
    "src/proto_gen",  # Generated protobuf/gRPC code
]

# Ignore Jupyter notebooks (not part of production code)
ignore_notebooks = true

# First-party modules - tell deptry what belongs to this project
known_first_party = [
    "src",
]

# PEP 621 dev dependency groups - these are NOT runtime dependencies
pep621_dev_dependency_groups = [
    "dev",
]

# Keep all rules enabled (DEP001-DEP005)
# Use per_rule_ignores for specific, justified exceptions only
ignore = []

# CI/Reporting integration
json_output = "reports/deptry/deptry.json"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "weaviate-haystack",   # Optional: for WeaviateDocumentStore (we use custom Weaviate integration)
    "grpcio-tools",        # Build-time only: used by make apps-generate-grpc
]

# pygount configuration (reference only - pygount uses CLI args, not pyproject.toml)
# Run: make code-stats

[tool.codespell]
# Paths to check
check-filenames = true
check-hidden = false

# Directories to skip
skip = ".git,.venv,venv,build,dist,reports,src/proto_gen,*.lock,uv.lock"

# File extensions to check
# Empty means "all"; explicit is safer
# Note: codespell uses comma-separated without spaces for extensions

# Use external ignore file for maintainability
ignore-words = "config/codespell-ignore.txt"
